[project]
name = "project-radar"
version = "1.0.0"
description = "Персональный технический радар проектов"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # длину строк контролирует форматтер
    "B008",    # Depends() в аргументах — идиома FastAPI
    "RUF001",  # кириллица в строках — здесь это норма
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["alembic/"]
